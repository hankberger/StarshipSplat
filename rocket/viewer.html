 #bar select{max-width:min(52vw,360px);text-overflow:ellipsis}
 @media (max-width:600px){ #bar{gap:6px;padding:6px 8px;font-size:13px} #bar label{display:none} #lyricTimerBtn{display:none} #hint{font-size:12px} } #hint{position:fixed;bottom:12px;left:12px;opacity:.7;z-index:10}

 #input{position:fixed;inset:0;z-index:0}
 #css3d{position:fixed;inset:0;pointer-events:none;z-index:1}
 #css3dFront{position:fixed;inset:0;pointer-events:none;z-index:3}
 .panel{width:480px;height:578px;display:flex;flex-direction:column}
 .panel .head{height:118px;flex:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:10px;padding:0 0 10px;box-sizing:border-box;color:#1d2930}
 .panel .title{font:600 66px/0.95 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;text-transform:uppercase}
 .panel .date,.panel .eyebrow,.panel .aside{font:500 21px/1 "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
 .panel .eyebrow{font-size:17px;letter-spacing:.14em;opacity:.75}
 .panel .meta{display:flex;justify-content:space-between;align-items:baseline;width:100%}
 .panel .aside{opacity:.75}
 .panel .lyrics{height:100px;flex:none;box-sizing:border-box;padding:14px 0 0;display:flex;flex-direction:column;gap:8px;overflow:visible}
 .panel .lyrics .now{position:relative;height:38px;flex:none;font:400 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;color:#000000b8}
 .panel .lyrics .line{position:absolute;left:50%;top:0;white-space:nowrap;transform-origin:center center;transform:translateX(-50%) scale(var(--fit,1))}
 .panel .lyrics .line .w{display:inline-block;opacity:0;transform:translateY(.22em);filter:blur(3px);
   transition:opacity .24s cubic-bezier(.2,.7,.2,1),transform .34s cubic-bezier(.16,1,.3,1),filter .24s ease-out;transition-delay:var(--d,0s)}

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; applyViewShift(); renderer.setSize(innerWidth, innerHeight); css.setSize(innerWidth, innerHeight); cssFront.setSize(innerWidth, innerHeight); });

  controls.update(dt); limitPan(); updatePanel(dt); updateLyrics(); if (skyDome) skyDome.position.copy(camera.position); panelFront.position.copy(panel.position); panelFront.quaternion.copy(panel.quaternion); panelFront.scale.copy(panel.scale);
  renderWithOcclusion(); if (FLAT_VIDEO) placeFlatVideo(); else css.render(backScene, camera); });
</script></body></html>
