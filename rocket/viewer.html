<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rocket tower splats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 html,body{margin:0;height:100%;background:#0d1014;color:#e8eaed;font:14px system-ui,sans-serif;overflow:hidden}
 #bar{position:fixed;top:12px;left:12px;display:flex;gap:8px;align-items:center;background:#1b2027cc;padding:8px 12px;border-radius:8px}
 select,button{font:inherit;background:#2a313b;color:inherit;border:1px solid #3c4552;border-radius:6px;padding:4px 8px}
 #hint{position:fixed;bottom:12px;left:12px;opacity:.7}
</style>
<script type="importmap">{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
 "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"}}</script>
</head><body>
<div id="bar"><label for="pick">Scene</label><select id="pick"></select><input type="file" id="file" accept=".spz" hidden><button id="reset">Reset view</button><span id="status"></span></div>
<div id="hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 5000);
scene.add(new SparkRenderer({ renderer }));
const controls = new OrbitControls(camera, renderer.domElement);
const home = () => { camera.position.set(13.3, 8.9, -0.5); controls.target.set(-5.34, 9.0, 1.2); controls.update(); };
home(); document.getElementById("reset").onclick = home;
const files = [
  { label: "360° (real + generated views)", url: "splats_360/refinedSplats_2000000.spz" },
  { label: "Real frames only", url: "splats_real/refinedSplats_2000000.spz" },
];
const pick = document.getElementById("pick"), status = document.getElementById("status"), fileInput = document.getElementById("file");
let mesh = null;
async function show(options) {
  status.textContent = "Loading…";
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
  mesh = new SplatMesh(options); scene.add(mesh);
  try { await mesh.initialized; status.textContent = ""; } catch (e) { status.textContent = "Failed to load: " + e.message; }
}
if (location.protocol === "file:") {
  // Browsers block pages opened from disk from reading neighbouring files, so ask for the file instead.
  pick.add(new Option("Choose a .spz file…", "")); pick.disabled = true;
  fileInput.hidden = false;
  status.textContent = "Pick an .spz from splats_360 or splats_real, or run open_viewer.bat";
  fileInput.onchange = async () => { const f = fileInput.files[0]; if (f) show({ fileBytes: new Uint8Array(await f.arrayBuffer()), fileName: f.name }); };
} else {
  for (const f of files) pick.add(new Option(f.label, f.url));
  pick.onchange = () => show({ url: pick.value }); show({ url: pick.value });
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script></body></html>
