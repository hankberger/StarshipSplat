<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rocket tower splats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 html,body{margin:0;height:100%;background:#0d1014;color:#e8eaed;font:14px system-ui,sans-serif;overflow:hidden}
 #bar{position:fixed;top:12px;left:12px;display:flex;gap:8px;align-items:center;background:#1b2027cc;padding:8px 12px;border-radius:8px}
 select,button{font:inherit;background:#2a313b;color:inherit;border:1px solid #3c4552;border-radius:6px;padding:4px 8px}
 #bar{z-index:10} #hint{position:fixed;bottom:12px;left:12px;opacity:.7;z-index:10}
 canvas{position:fixed;inset:0}
 #css3d{position:fixed;inset:0;pointer-events:none;z-index:5}
 .panel{width:480px;height:578px;display:flex;flex-direction:column}
 .panel .head{height:118px;flex:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:10px;padding:0 0 10px;box-sizing:border-box;color:#1d2930}
 .panel .title{font:600 66px/0.95 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;text-transform:uppercase}
 .panel .date,.panel .eyebrow,.panel .aside{font:500 21px/1 "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
 .panel .eyebrow{font-size:17px;letter-spacing:.14em;opacity:.75}
 .panel .meta{display:flex;justify-content:space-between;align-items:baseline;width:100%}
 .panel .aside{opacity:.75}
 .panel .lyrics{height:100px;flex:none;box-sizing:border-box;padding:14px 0 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
 .panel .lyrics .now{position:relative;height:34px;flex:none;font:400 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;color:#000000b8}
 .panel .lyrics .line{position:absolute;left:50%;top:0;white-space:nowrap;transform-origin:center center;transform:translateX(-50%) scale(var(--fit,1))}
 .panel .lyrics .line .w{display:inline-block;opacity:0;transform:translateY(.22em);filter:blur(3px);
   transition:opacity .24s cubic-bezier(.2,.7,.2,1),transform .34s cubic-bezier(.16,1,.3,1),filter .24s ease-out;transition-delay:var(--d,0s)}
 .panel .lyrics .line.in .w{opacity:1;transform:translateY(0);filter:blur(0)}
 .panel .lyrics .line.out{opacity:0;transform:translate(-50%,-4px) scale(var(--fit,1));filter:blur(3px);transition:opacity .13s ease-in,transform .13s ease-in,filter .13s ease-in}
 .panel .lyrics .next{text-align:center;font:500 15px/1 "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#00000073;transition:opacity .35s ease}
 .panel iframe{width:100%;height:360px;flex:none;border:0;pointer-events:auto;border-radius:12px;box-shadow:0 10px 40px #0008;background:#000}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script type="importmap">{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
 "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"}}</script>
</head><body>
<div id="bar"><label for="pick">Scene</label><select id="pick"></select><input type="file" id="file" accept=".spz" hidden><button id="reset">Reset view</button><button id="panelToggle">Hide panel</button><button id="lyricTimerBtn" title="Temporary tool: tap out lyric timings">Time lyrics</button><span id="status"></span></div>
<div id="hint">Drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { EXRLoader } from "three/addons/loaders/EXRLoader.js";
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("rgb(152,167,176)");
// Sky: an equirectangular HDRI as the backdrop. The flat colour above stays as the fallback if it fails to load.
// An HDRI sits infinitely far away, so through a long lens only a small patch of it fills the frame and the clouds look huge and soft.
// "scale" shrinks the sky's features: the HDRI is repeated that many times around the horizon (a whole number keeps it seamless)
// and squeezed vertically by its own factor. "horizonDeg" is how far below the scene's horizon the HDRI's own horizon sits.
const SKY = { url: "hdri/scythian_tombs_puresky_1k.exr", intensity: 0.26, rotationDeg: 110, scale: [6, 4], horizonDeg: 6 };   // scale: [around the horizon, vertically]
let skyDome = null;
new EXRLoader().load(SKY.url, (tex) => {
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(SKY.scale[0], SKY.scale[1]); tex.offset.set(0, 0.5 - 0.5 * SKY.scale[1] + SKY.scale[1] * SKY.horizonDeg / 180);
  const geo = new THREE.SphereGeometry(2000, 64, 32); geo.scale(-1, 1, 1);          // viewed from inside
  const mat = new THREE.MeshBasicMaterial({ map: tex, depthTest: false, depthWrite: false, fog: false, toneMapped: false });
  // Keep the sky's contrast as it is (a plain exposure scale) and only round off the very brightest highlights so they don't clip to white.
  mat.onBeforeCompile = (shader) => { shader.fragmentShader = shader.fragmentShader.replace("#include <tonemapping_fragment>",
    "vec3 skyC = " + SKY.intensity.toFixed(3) + " * gl_FragColor.rgb; vec3 skyOver = max(skyC - 0.8, 0.0); gl_FragColor.rgb = min(skyC, 0.8) + skyOver / (1.0 + skyOver / 0.2);"); };
  skyDome = new THREE.Mesh(geo, mat); skyDome.renderOrder = -1000; skyDome.frustumCulled = false;
  skyDome.rotation.y = THREE.MathUtils.degToRad(SKY.rotationDeg);
  scene.add(skyDome); window.__v && (window.__v.skyDome = skyDome);
}, undefined, (err) => console.warn("Sky HDRI failed to load", err));
const LENS_MM = 85;   // focal length, as on a 35mm camera
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 5000); camera.setFocalLength(LENS_MM);
scene.add(new SparkRenderer({ renderer }));
const controls = new OrbitControls(camera, renderer.domElement); controls.enablePan = false; /* panning would move the orbit centre off the rocket and drag the overlay with it */ window.__v = { camera, controls };
let view = { cam: [140, 5, -12], target: [-5.34, 9.0, 1.2] };
const home = () => { camera.position.set(...view.cam); controls.target.set(...view.target); controls.update(); };
home(); document.getElementById("reset").onclick = home;
const files = [
  { label: "New clips, cleaned, circular base, sky colour removed", url: "splats_r2/cleaned_disc_nosky.spz", cam: [112, 5, 102], target: [2.21, 13.8, -0.42], groundNormal: [0.0076, 1, 0.0304], pivot: [2.42, 0.02, -0.14] },
  { label: "New clips, cleaned, circular base", url: "splats_r2/cleaned_disc.spz", cam: [112, 5, 102], target: [2.21, 13.8, -0.42], groundNormal: [0.0076, 1, 0.0304], pivot: [2.42, 0.02, -0.14] },
  { label: "New clips, cleaned up", url: "splats_r2/cleaned.spz", cam: [112, 5, 102], target: [2.21, 13.8, -0.42], groundNormal: [0.0076, 1, 0.0304], pivot: [2.42, 0.02, -0.14] },
  { label: "New clips (142 real frames)", url: "splats_r2/refinedSplats_2000000.spz", cam: [112, 5, 102], target: [2.21, 13.8, -0.42], groundNormal: [0.0076, 1, 0.0304], pivot: [2.42, 0.02, -0.14] },
  { label: "Improved (cleaned depth, focused on tower)", url: "splats_v2/refinedSplats_2000000.spz" },
  { label: "360° (real + generated views)", url: "splats_360/refinedSplats_2000000.spz" },
  { label: "Real frames only", url: "splats_real/refinedSplats_2000000.spz" },
];
const pick = document.getElementById("pick"), status = document.getElementById("status"), fileInput = document.getElementById("file");
let mesh = null;
// The reconstruction came out tilted by about 1.8 degrees. Rotate the splats so the measured ground normal points straight up,
// pivoting about the ground point under the ship so the ship stays where it is.
function levelGround(obj, f) {
  obj.quaternion.identity(); obj.position.set(0, 0, 0);
  if (!f || !f.groundNormal) return;
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(...f.groundNormal).normalize(), new THREE.Vector3(0, 1, 0));
  const p = new THREE.Vector3(...f.pivot);
  obj.quaternion.copy(q); obj.position.copy(p).sub(p.clone().applyQuaternion(q));
}
async function show(options, f) {
  status.textContent = "Loading…";
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
  mesh = new SplatMesh(options); levelGround(mesh, f); scene.add(mesh);
  try { await mesh.initialized; status.textContent = ""; } catch (e) { status.textContent = "Failed to load: " + e.message; }
}
if (location.protocol === "file:") {
  // Browsers block pages opened from disk from reading neighbouring files, so ask for the file instead.
  pick.add(new Option("Choose a .spz file…", "")); pick.disabled = true;
  fileInput.hidden = false;
  status.textContent = "Pick an .spz from splats_360 or splats_real, or run open_viewer.bat";
  fileInput.onchange = async () => { const f = fileInput.files[0]; if (f) show({ fileBytes: new Uint8Array(await f.arrayBuffer()), fileName: f.name }); };
} else {
  for (const f of files) pick.add(new Option(f.label, f.url));
  const go = () => { const f = files[pick.selectedIndex]; if (f.cam) view = { cam: f.cam, target: f.target }; else view = { cam: [140, 5, -12], target: [-5.34, 9.0, 1.2] }; home(); show({ url: f.url }, f); };
  pick.onchange = go; go();
}
// --- Floating web panel: an iframe that faces the camera and eases round to the rocket's right-hand side ---
const PANEL = { url: new URLSearchParams(location.search).get("panel") || "https://www.youtube.com/embed/NmEyGiaqm7k?si=g5cYmlWV7J7n5Ylv&start=25&fs=0&autoplay=1&playsinline=1&enablejsapi=1",
                volume: 33,     // starting volume, 0-100
                offset: 9,      // distance to the right of the rocket, in scene units
                lift: 1.5,      // height above the orbit target
                size: 0.016,    // scene units per CSS pixel (480x360, 4:3 -> about 7.7 x 5.8 units)
                ease: 4 };      // higher = snappier follow
const css = new CSS3DRenderer(); css.domElement.id = "css3d"; css.setSize(innerWidth, innerHeight); document.body.appendChild(css.domElement);
const panelEl = document.createElement("div"); panelEl.className = "panel";
const headEl = document.createElement("div"); headEl.className = "head";
const titleEl = document.createElement("span"); titleEl.className = "title"; titleEl.textContent = "Starship S42";
const dateEl = document.createElement("span"); dateEl.className = "date"; dateEl.textContent = "Flight 15 · Don’t Panic";
headEl.append(dateEl, titleEl); panelEl.appendChild(headEl);
const frame = document.createElement("iframe"); frame.src = PANEL.url; frame.title = "YouTube video player";
frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
frame.referrerPolicy = "strict-origin-when-cross-origin";   // no allowfullscreen: fullscreen is disabled
 panelEl.appendChild(frame);
// --- Karaoke lyrics under the video, driven by a timed-lyrics (.lrc) file and the player's clock ---
const LYRICS = { url: new URLSearchParams(location.search).get("lyrics") || "lyrics.lrc", fitWidth: 480 };
const lyricsEl = document.createElement("div"); lyricsEl.className = "lyrics";
const nowEl = document.createElement("div"); nowEl.className = "now";
const nextEl = document.createElement("div"); nextEl.className = "next";
lyricsEl.append(nowEl, nextEl); panelEl.appendChild(lyricsEl);
function parseLrc(text) {
  let offset = 0; const lines = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith("#")) continue;
    const meta = line.match(/^\[([a-z]+):(.*)\]$/i);
    if (meta) { if (meta[1].toLowerCase() === "offset") offset = parseFloat(meta[2]) || 0; continue; }
    const tags = [...line.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)]; if (!tags.length) continue;
    const words = line.replace(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g, "").trim();
    for (const t of tags) lines.push({ t: parseInt(t[1], 10) * 60 + parseFloat(t[2].replace(":", ".")), text: words });
  }
  for (const l of lines) l.t -= offset / 1000;                 // LRC convention: positive offset shows lyrics earlier
  return lines.sort((a, b) => a.t - b.t);
}
let lyricLines = [], lyricIndex = -2;
fetch(LYRICS.url).then((r) => (r.ok ? r.text() : "")).then((t) => { lyricLines = parseLrc(t); window.__v.lyrics = lyricLines; lyricsEl.style.display = lyricLines.length ? "" : "none"; }).catch(() => { lyricsEl.style.display = "none"; });
// The YouTube player reports its position a few times a second; between reports the clock is advanced locally.
const yt = { time: 0, at: performance.now(), state: -1, rate: 1 };
frame.addEventListener("load", () => frame.contentWindow?.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "https://www.youtube.com"));
addEventListener("message", (e) => {
  if (e.origin !== "https://www.youtube.com") return;
  let d; try { d = JSON.parse(e.data); } catch { return; }
  const info = d && d.info; if (!info) return;
  if (typeof info.playerState === "number") { yt.time = videoTime(); yt.at = performance.now(); yt.state = info.playerState; }
  if (typeof info.playbackRate === "number") yt.rate = info.playbackRate;
  if (typeof info.currentTime === "number") { yt.time = info.currentTime; yt.at = performance.now(); }
});
function videoTime() { return yt.state === 1 ? yt.time + ((performance.now() - yt.at) / 1000) * yt.rate : yt.time; }
window.__v.videoTime = videoTime;
// Hooks for the temporary lyric timing tool (lyric_timer.js).
Object.assign(window.__v, { lyricsUrl: LYRICS.url, ytCommand: (f, a) => ytCommand(f, a), ytState: () => yt.state,
  setLyrics: (lines) => { lyricLines = lines; lyricIndex = -2; lyricsEl.style.display = ""; if (!lines.length) showLine(""), showNext(""); } });
document.getElementById("lyricTimerBtn").onclick = (e) => { const sc = document.createElement("script"); sc.src = "lyric_timer.js?t=" + Date.now(); document.body.appendChild(sc); e.target.blur(); };
// The old line clears quickly first; then the new line arrives word by word, each word rising a little and sharpening into focus.
function showLine(text) {
  const leaving = nowEl.querySelectorAll(".line:not(.out)");
  for (const old of leaving) { old.classList.add("out"); setTimeout(() => old.remove(), 180); }
  if (!text) return;
  const el = document.createElement("span"); el.className = "line";
  const wait = leaving.length ? 0.11 : 0;                        // let the old line finish leaving before the new one starts
  text.split(" ").filter(Boolean).forEach((word, i) => {
    const w = document.createElement("span"); w.className = "w"; w.textContent = word; w.style.setProperty("--d", (wait + i * 0.02).toFixed(3) + "s");
    el.append(w, " ");
  });
  nowEl.appendChild(el);
  const width = el.offsetWidth; if (width > LYRICS.fitWidth) el.style.setProperty("--fit", (LYRICS.fitWidth / width).toFixed(3));   // shrink a long line to the video's width
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
}
function showNext(text) {
  if (nextEl.textContent === text) return;
  nextEl.style.opacity = "0"; setTimeout(() => { nextEl.textContent = text; nextEl.style.opacity = text ? "1" : "0"; }, 250);
}
function updateLyrics() {
  if (!lyricLines.length) return;
  const t = videoTime(); let i = -1;
  for (let k = 0; k < lyricLines.length && lyricLines[k].t <= t; k++) i = k;
  if (i === lyricIndex) return;
  lyricIndex = i;
  showLine(i >= 0 ? lyricLines[i].text : "");
  let k = i + 1; while (k < lyricLines.length && !lyricLines[k].text) k++;
  showNext(i >= 0 && k < lyricLines.length ? lyricLines[k].text : "");   // nothing is previewed before the first line starts
}
// Browsers only allow autoplay when muted, so the video starts silent and is unmuted on the first click, drag or key press in the viewer.
const ytCommand = (func, args = []) => frame.contentWindow?.postMessage(JSON.stringify({ event: "command", func, args }), "https://www.youtube.com");
// Start with sound at PANEL.volume. Browsers decide whether a page may autoplay with sound; if this one refuses,
// fall back to muted autoplay and switch the sound on at the first click, drag or key press in the viewer.
const startWithSound = () => { ytCommand("setVolume", [PANEL.volume]); ytCommand("unMute"); ytCommand("playVideo"); };
const unmuteOnce = () => { startWithSound(); removeEventListener("pointerdown", unmuteOnce, true); removeEventListener("keydown", unmuteOnce, true); };
if (PANEL.url.includes("youtube.com/embed")) {
  frame.addEventListener("load", () => {
    setTimeout(startWithSound, 600);
    setTimeout(() => {
      if (yt.state === 1) return;                               // playing with sound: nothing more to do
      ytCommand("mute"); ytCommand("playVideo");                // blocked: play silently and wait for the first interaction
      addEventListener("pointerdown", unmuteOnce, true); addEventListener("keydown", unmuteOnce, true);
    }, 3000);
  });
}
// The iframe takes the pointer, so YouTube's own controls (pause, volume, seek) work when the cursor is over the video.
const panel = new CSS3DObject(panelEl); panel.scale.setScalar(PANEL.size); scene.add(panel);
const UP = new THREE.Vector3(0, 1, 0), fwd = new THREE.Vector3(), right = new THREE.Vector3(), goal = new THREE.Vector3();
function panelGoal() {
  camera.getWorldDirection(fwd); right.crossVectors(fwd, UP);
  if (right.lengthSq() < 1e-6) right.set(1, 0, 0);          // looking straight up or down
  right.normalize();
  return goal.copy(controls.target).addScaledVector(right, PANEL.offset).addScaledVector(UP, PANEL.lift);
}
let panelPlaced = false;
function updatePanel(dt) {
  const g = panelGoal();
  if (!panelPlaced) { panel.position.copy(g); panel.quaternion.copy(camera.quaternion); panelPlaced = true; return; }
  const k = 1 - Math.exp(-PANEL.ease * dt);                  // frame-rate independent easing
  panel.position.lerp(g, k); panel.quaternion.slerp(camera.quaternion, k);
}
const panelToggle = document.getElementById("panelToggle");
panelToggle.onclick = () => { panel.visible = !panel.visible; panelEl.style.display = panel.visible ? "" : "none"; panelToggle.textContent = panel.visible ? "Hide panel" : "Show panel"; };
window.__v.panel = panel;
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.setFocalLength(LENS_MM); renderer.setSize(innerWidth, innerHeight); css.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
// Keep the camera above the ground: the lowest orbit angle allowed depends on how far out the camera is.
const GROUND = { y: 0, clearance: 1.0 };
function limitToGround() {
  const dist = camera.position.distanceTo(controls.target);
  const c = THREE.MathUtils.clamp((GROUND.y + GROUND.clearance - controls.target.y) / Math.max(dist, 1e-3), -1, 1);
  controls.maxPolarAngle = Math.acos(c);
}
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.1); limitToGround(); controls.update(); updatePanel(dt); updateLyrics(); if (skyDome) skyDome.position.copy(camera.position); renderer.render(scene, camera); css.render(scene, camera); });
</script></body></html>
